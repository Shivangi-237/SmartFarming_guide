<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Farming - Weather Forecast</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="weatherstyle.css">
</head>
<body>
  <a href="/" class="back-nav-btn">
    <i class="fas fa-arrow-left"></i> <span>Dashboard</span>
  </a>

  <header>
    <h1>Weather Forecast</h1>
    <p>Get live agricultural weather updates for your farm or search any city.</p>
  </header>

  <div class="controls">
    <select id="lang-select">
      <option value="en">English</option>
      <option value="hi">हिंदी (Hindi)</option>
    </select>
    <div class="input-wrap">
      <input type="text" id="city-input" placeholder="Enter city name (e.g. Dehradun)" value="Dehradun">
    </div>
    <button id="search-btn"><i class="fas fa-magnifying-glass"></i> Search</button>
    <button id="auto-locate-btn"><i class="fas fa-location-crosshairs"></i> Auto Detect</button>
  </div>

  <div id="weather-info" class="weather-info"></div>

  <script src="weatherscript.js"></script>
</body>
</html>
